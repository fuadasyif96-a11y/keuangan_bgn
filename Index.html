                            <button onClick={() => { setIsLoggedIn(false); setCurrentUser(null); }} title={(!isMobileOpen && isSidebarCollapsed) ? 'Logout' : ''}
                                className={`w-full flex justify-center items-center space-x-2 bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white rounded-xl text-sm font-bold ${(!isMobileOpen && isSidebarCollapsed) ? 'p-3' : 'py-3'}`}>
                                <svg className="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                {(!isSidebarCollapsed || isMobileOpen) && <span>Logout</span>}
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white border-b h-16 flex items-center justify-between px-4 md:px-8 shadow-sm z-10 no-print flex-shrink-0">
                            <div className="flex items-center space-x-3 md:space-x-4">
                                <button onClick={() => { if(window.innerWidth < 768) setIsMobileOpen(!isMobileOpen); else setIsSidebarCollapsed(!isSidebarCollapsed); }} className="p-2 text-brand-dark rounded-lg hover:bg-slate-100">
                                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                                </button>
                                <h2 className="text-base md:text-xl font-bold text-brand-dark hidden sm:block">
                                    {activeMenu === 'dashboard' && 'Dashboard Utama'} {activeMenu === 'tagihan' && 'Form Pengajuan Tagihan'}
                                    {activeMenu === 'proses' && 'Antrean Pembayaran'} {activeMenu === 'bku' && 'Buku Kas Umum (BKU)'}
                                    {activeMenu === 'rekap' && 'Rekapitulasi Tagihan'} {activeMenu === 'master' && 'Kelola Master Data'}
                                    {activeMenu === 'users' && 'Akun Pengguna'}
                                </h2>
                            </div>
                            <div className="flex items-center space-x-3">
                                <div className="text-right hidden sm:block"><p className="text-sm font-bold leading-tight">{currentUser.username}</p><p className="text-[10px] text-brand-gold font-medium">{currentUser.role}</p></div>
                                <div className="w-9 h-9 md:w-10 md:h-10 bg-brand-dark rounded-full shadow-md flex items-center justify-center text-white font-bold text-sm md:text-base">{currentUser.username.substring(0, 2).toUpperCase()}</div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 z-0">
                            {activeMenu === 'dashboard' && <DashboardView dbInvoices={dbInvoices} currentUser={currentUser} />}
                            {activeMenu === 'tagihan' && <InputTagihanView dbSuppliers={dbSuppliers} dbRekenings={dbRekenings} setActiveMenu={setActiveMenu} currentUser={currentUser} onAddData={handleAddData} onShowAlert={(msg) => setDialog({message: msg, type:'alert'})} />}
                            {activeMenu === 'proses' && <ProsesTagihanView dbInvoices={dbInvoices} currentUser={currentUser} onUpdateData={handleUpdateData} />}
                            {activeMenu === 'bku' && <BkuView dbInvoices={dbInvoices} dbIncomes={dbIncomes} currentUser={currentUser} onAddData={handleAddData} onShowAlert={(msg) => setDialog({message: msg, type:'alert'})} />}
                            {activeMenu === 'rekap' && <RekapTagihanView dbInvoices={dbInvoices} currentUser={currentUser} onDeleteData={handleDeleteData} onShowConfirm={(msg, action) => setDialog({message: msg, type: 'confirm', onConfirm: action})} />}
                            {activeMenu === 'master' && <KelolaMasterView dbSuppliers={dbSuppliers} dbRekenings={dbRekenings} onAddData={handleAddData} onDeleteData={handleDeleteData} onShowAlert={(msg) => setDialog({message: msg, type:'alert'})} />}
                            {activeMenu === 'users' && <AkunPenggunaView dbUsers={dbUsers} onAddData={handleAddData} onDeleteData={handleDeleteData} onShowAlert={(msg) => setDialog({message: msg, type:'alert'})} onShowConfirm={(msg, action) => setDialog({message: msg, type: 'confirm', onConfirm: action})} />}
                        </main>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
